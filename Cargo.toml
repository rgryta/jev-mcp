[package]
name = "jev-mcp"
description = "MCP server over TypeSafe's Jev: typed, calibrated yes/no, choice and score answers"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
publish = false

[dependencies]
axum = "0.8.9"
futures = "0.3.31"
# Pinned exactly: rmcp went v1 -> v2 -> v3 inside a year and the streamable-HTTP server
# API moved with it, so a caret range could change the transport on a `cargo update`.
rmcp = { version = "=3.10.0", features = ["server", "macros", "transport-streamable-http-server"] }
# Bundled roots: the image is `FROM scratch` and has no CA store.
reqwest = { version = "0.12.28", default-features = false, features = [
    "rustls-tls-webpki-roots",
    "http2",
    "json",
] }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net", "io-util", "signal"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
