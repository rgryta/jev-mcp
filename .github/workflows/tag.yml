name: tag

# Bump `version` in Cargo.toml, merge to main, and this tags it and starts image.yml.
# No-op if the tag already exists.
on:
  push:
    branches: [main]
    paths: [Cargo.toml]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  tag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Within [package] only, so a pinned dependency's `version =` cannot win.
          tag=v$(sed -n '/^\[package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
            echo "$tag already exists"
            exit 0
          fi
          gh api "repos/${{ github.repository }}/git/refs" -f ref="refs/tags/$tag" -f sha="$GITHUB_SHA"
          # A tag made with GITHUB_TOKEN fires no push event, so start the build directly.
          gh workflow run image.yml --ref main -f tag="$tag"
