name: ci

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: x86_64-unknown-linux-musl
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      # Word for word what deploy/Dockerfile runs, so a green CI says something about the image.
      - run: cargo build --release --bins --target x86_64-unknown-linux-musl
      # The image is `FROM scratch` with no CA store: every Jev call would fail at runtime.
      - name: No release binary may need a system trust store
        run: |
          found=$(cargo tree -e normal --prefix none \
                    --target x86_64-unknown-linux-musl 2>/dev/null \
                  | awk '{print $1}' | sort -u \
                  | grep -xE 'rustls-native-certs|native-tls|openssl-sys' || true)
          if [ -n "$found" ]; then
            echo "::error::release graph links a system trust store: $found" >&2
            exit 1
          fi
